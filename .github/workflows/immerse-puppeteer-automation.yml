name: immerse-puppeteer-automation

# Temporarily manual-only until the disposable HeavyDB path has a successful run.
# Replaces the legacy Jenkins immerse-puppeteer-automation job.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to test"
        type: string
        default: ""
      heavydb_run_id:
        description: "Product Builder run ID (leave empty for latest published master build)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: immerse-puppeteer-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immerse-puppeteer-automation:
    name: immerse-puppeteer-automation
    runs-on: linux-amd64-cpu32
    timeout-minutes: 120
    env:
      HEAVYDB_RESOURCE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
      HEAVYDB_DIAGNOSTICS_DIR: ${{ github.workspace }}/heavydb-diagnostics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@^11.6.1

      - name: Use HTTPS for GitHub dependencies
        run: |
          git config --global --add \
            url."https://github.com/".insteadOf \
            "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf \
            "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Check artifact download prerequisites
        run: |
          git lfs version
          jq --version
          unzip -v

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download and verify HeavyDB product
        id: heavydb-product
        env:
          HEAVYAI_BINARY_SCAN_TOKEN: ${{ secrets.HEAVYAI_BINARY_SCAN_TOKEN }}
          HEAVYDB_PRODUCT_DIR: ${{ runner.temp }}/heavydb-product-${{ github.run_id }}-${{ github.run_attempt }}
          HEAVYDB_RUN_ID: ${{ inputs.heavydb_run_id }}
        run: |
          args=(--output-dir "$HEAVYDB_PRODUCT_DIR")
          if [ -n "$HEAVYDB_RUN_ID" ]; then
            args+=(--run-id "$HEAVYDB_RUN_ID")
          fi
          scripts/ci/puppeteer-heavydb/download-heavydb-artifact.sh "${args[@]}"

      - name: Start disposable HeavyDB
        env:
          HEAVYDB_TARBALL: ${{ steps.heavydb-product.outputs.tarball }}
        run: scripts/ci/puppeteer-heavydb/start-heavydb.sh

      - name: Load deterministic test fixtures
        run: scripts/ci/puppeteer-heavydb/load-fixtures.sh

      - name: Configure test server
        run: |
          node <<'NODE'
          const fs = require("fs")
          const server = {
            database: "heavyai",
            master: true,
            username: "admin",
            password: "HyperInteractive",
            url: "http://127.0.0.1:6273/",
            GTM: "GTM-MDD888",
            theme: "dark"
          }

          fs.writeFileSync(
            "src/servers.local.json",
            `${JSON.stringify([server], null, 2)}\n`
          )
          NODE

      - name: Start Immerse
        run: |
          npm run start -- --no-open > webpack.log 2>&1 &
          echo "WEBPACK_SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Immerse
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent --show-error http://localhost:8002/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done

          cat webpack.log
          echo "Immerse did not become ready within 10 minutes" >&2
          exit 1

      - name: Run Puppeteer integration tests
        run: npm run test:ui

      - name: Stop Immerse
        if: always()
        run: |
          if [ -n "${WEBPACK_SERVER_PID:-}" ]; then
            kill "$WEBPACK_SERVER_PID" 2>/dev/null || true
          fi

      - name: Collect HeavyDB diagnostics
        if: always()
        run: |
          if [ -x scripts/ci/puppeteer-heavydb/collect-diagnostics.sh ]; then
            scripts/ci/puppeteer-heavydb/collect-diagnostics.sh
          fi

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppeteer-test-diagnostics-${{ github.run_attempt }}
          path: |
            heavydb-diagnostics
            jest-results.xml
            webpack.log
            src/ui-tests/_screenshot-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove disposable HeavyDB resources
        if: always()
        env:
          HEAVYDB_PRODUCT_DIR: ${{ runner.temp }}/heavydb-product-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -x scripts/ci/puppeteer-heavydb/cleanup-heavydb.sh ]; then
            scripts/ci/puppeteer-heavydb/cleanup-heavydb.sh
          fi
