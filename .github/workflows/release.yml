name: Release
run-name: ${{ inputs.description != '' && format('immerse — {0}', inputs.description) || 'immerse CI' }}

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Branch or SHA to check out (e.g. rc-2352)'
        type: string
        required: true
      heavy_eco:
        description: 'Enable Heavy Eco build'
        type: boolean
        default: false
      description:
        description: 'Build description label'
        type: string
        default: ''

jobs:
  build:
    runs-on: linux-amd64-cpu16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Upgrade npm
        run: npm install -g npm@^11.6.1

      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.PRIVATE_PACKAGES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "ssh://git@github.com/"
        run: npm ci

      - name: Build
        env:
          HEAVY_ECO: ${{ inputs.heavy_eco == true && 'true' || '' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: npm run build:prod

      - name: Test
        run: npm test
