name: immerse-pr

# ESLint also enforces the repository's Prettier rules.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to test"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: immerse-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immerse-pr:
    name: immerse-pr
    runs-on: linux-amd64-cpu16
    timeout-minutes: 60
    env:
      # The PR checks do not use a browser. Avoid downloading Chromium during
      # npm ci; the Puppeteer workflow installs it independently.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@^11.6.1

      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: "ssh://git@github.com/"
        run: npm ci

      - name: Lint and check formatting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run component tests
        run: npm run test:component
