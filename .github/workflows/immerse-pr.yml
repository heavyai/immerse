name: immerse-pr

# ESLint also enforces the repository's Prettier rules.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to test"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: immerse-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immerse-pr:
    name: immerse-pr
    runs-on: linux-amd64-cpu16
    timeout-minutes: 60
    env:
      # The PR checks do not use a browser. Avoid downloading Chromium during
      # pnpm install --frozen-lockfile; the Puppeteer workflow installs it independently.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Check license headers
        env:
          RAPIDS_COPYRIGHT_FORCE_SPDX: "1"
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always verify-copyright \
            --from-ref origin/main --to-ref HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: "ssh://git@github.com/"
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

      - name: Check modernization boundaries
        run: pnpm run modernization:check && pnpm run test:modernization-tools

      - name: Lint and check formatting
        run: pnpm run lint

      - name: Check workspace declaration contracts
        run: pnpm run ts:packages

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run component tests
        run: pnpm run test:component
