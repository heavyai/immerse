<!doctype html>
<html lang="en">
<head>
  <title>SAML Log In Error</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">

  <style>
    body {
      background: #f5f5f5;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      line-height: 24px;
    }

    .page-header {
      background: white;
      height: 48px;
    }

    .page-header img {
      height: 21px;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 28px;
    }

    .logged-out-modal {
      width: 510px;
      margin: 0 auto;
      background-color: white;
      margin-top: 64px;
      border: 1px solid #e2e2e2;
    }

    .header {
      color: #4a4a4a;
      font-size: $fontSizeXLarge;
      padding: 12px;
    }

    .content {
      color: #202020;
      font-size: $fontSizeNormal;
      padding: 12px;
      height: 80px;
    }

    .content a:visited, .content a {
      color: #0087D1;
    }

  </style>
</head>

<body>
  <div class="logged-out">
    <div class="logged-out-modal">
      <div class="header">SAML Login Error</div>
      <div class="content">
        An error has occurred during SAML login.<br />
        Please contact your administrator
        or try to <a href="/">log in again</a>.
      </div>
    </div>
  </div>
</body>
</html>
